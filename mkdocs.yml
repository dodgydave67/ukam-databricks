site_name: UKAM on Databricks
site_description: Production setup and code for running UK Address Matcher on Databricks.
site_url: https://dodgydave67.github.io/ukam-databricks/
repo_url: https://github.com/dodgydave67/ukam-databricks
repo_name: dodgydave67/ukam-databricks
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/map-marker-check
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - assets/extra.css

nav:
  - Start here: index.md
  - Before you run: setup.md
  - Run UKAM: run.md
  - Chunk large inputs: chunking.md
  - Settings: settings.md
